<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>LMS Portal — My Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3f0;
  --surface:#ffffff;
  --sidebar-bg:#ffffff;
  --sidebar-hover:rgba(109,40,217,0.05);
  --sidebar-active:rgba(109,40,217,0.1);
  --sidebar-active-border:#7c3aed;
  --text:#1a1a2e;
  --muted:#6b7280;
  --faint:#ede9fe;
  --border:rgba(0,0,0,0.07);
  --accent:#7c3aed;
  --accent2:#a78bfa;
  --accent-light:#ede9fe;
  --green:#059669;--green-bg:#ecfdf5;
  --red:#dc2626;--red-bg:#fef2f2;
  --amber:#d97706;--amber-bg:#fffbeb;
  --blue:#2563eb;--blue-bg:#eff6ff;
  --teal:#0891b2;--teal-bg:#ecfeff;
  --radius:12px;--radius-sm:8px;
  font-family:'Plus Jakarta Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
.layout{display:flex;height:100vh}

/* ─── SIDEBAR ─── */
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar-bg);display:flex;flex-direction:column;height:100vh;position:relative;overflow:hidden;border-right:1px solid rgba(0,0,0,0.07)}
.sidebar::before{content:'';position:absolute;top:-60px;left:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(124,58,237,0.06) 0%,transparent 70%);pointer-events:none}
.sidebar::after{content:'';position:absolute;bottom:60px;right:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(167,139,250,0.04) 0%,transparent 70%);pointer-events:none}
.sidebar-logo{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(0,0,0,0.06)}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 14px rgba(124,58,237,0.4)}
.logo-icon svg{width:17px;height:17px;fill:#fff}
.logo-name{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:#1a1a2e;letter-spacing:-0.02em}
.logo-sub{font-size:9px;color:rgba(109,40,217,0.5);letter-spacing:0.08em;text-transform:uppercase;font-weight:500}
.sidebar-scroll{flex:1;overflow-y:auto;padding:12px 12px}
.sidebar-scroll::-webkit-scrollbar{width:0}
.nav-section{font-size:9.5px;font-weight:600;color:rgba(0,0,0,0.3);letter-spacing:0.1em;text-transform:uppercase;padding:12px 8px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:#6b7280;font-size:13px;font-weight:500;margin:1px 0;transition:all 0.15s;position:relative;border-left:2px solid transparent}
.nav-item:hover{background:var(--sidebar-hover);color:#1a1a2e;border-left-color:rgba(109,40,217,0.3)}
.nav-item.active{background:var(--sidebar-active);color:#7c3aed;border-left-color:var(--sidebar-active-border)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:14px 12px;border-top:1px solid rgba(0,0,0,0.06)}
.user-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background 0.15s}
.user-card:hover{background:rgba(109,40,217,0.05)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:600;color:#1a1a2e}
.user-role{font-size:10px;color:#6b7280}
.status-dot{width:7px;height:7px;border-radius:50%;background:#10b981;margin-left:auto;box-shadow:0 0 0 2px rgba(16,185,129,0.3)}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 28px;flex-shrink:0}
.topbar-left{display:flex;flex-direction:column}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:-0.02em;font-family:'Sora',sans-serif}
.topbar-breadcrumb{font-size:11px;color:var(--muted);margin-top:0px}

/* ─── CONTENT ─── */
.content{flex:1;overflow-y:auto;padding:24px 28px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:2px}

/* SCREENS */
.screen{display:none}
.screen.visible{display:flex;flex-direction:column}

/* TABS */
.course-tabs{display:flex;gap:24px;border-bottom:1.5px solid var(--border);margin-bottom:20px;padding-bottom:0}
.course-tab{padding:12px 0;border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.15s;border-bottom:2px solid transparent;position:relative;top:1.5px}
.course-tab:hover{color:var(--text)}
.course-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* TOOLBAR */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:12px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.search-wrap{flex:1;position:relative;max-width:300px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px}
.search-input{width:100%;height:34px;border:1.5px solid var(--border);border-radius:20px;background:var(--bg);padding:0 14px 0 34px;font-size:13px;color:var(--text);outline:none;font-family:inherit;transition:all 0.15s}
.search-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,0.08)}

/* COURSE GRID */
.course-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:22px}
.course-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.18s;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.1);border-color:var(--accent)}
.course-header{height:140px;background:linear-gradient(135deg,#7c3aed,#9333ea);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:20px;position:relative;overflow:hidden}
.course-header::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);pointer-events:none}
.course-header.teal{background:linear-gradient(135deg,#0891b2,#06b6d4)}
.course-header.green{background:linear-gradient(135deg,#059669,#10b981)}
.course-header.amber{background:linear-gradient(135deg,#d97706,#f59e0b)}
.course-type{display:inline-block;background:rgba(0,0,0,0.2);color:#fff;padding:5px 12px;border-radius:20px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;z-index:1;backdrop-filter:blur(4px)}
.course-header-title{color:#fff;font-size:16px;font-weight:700;z-index:1;margin-top:8px}
.course-body{padding:18px;flex:1;display:flex;flex-direction:column}
.course-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.01em;margin-bottom:8px}
.course-meta{display:flex;gap:12px;margin-bottom:14px;font-size:12px}
.course-meta-item{display:flex;flex-direction:column}
.course-meta-label{color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px}
.course-meta-value{color:var(--text);font-weight:600}
.course-price{font-size:18px;font-weight:700;color:var(--accent)}
.course-prog{margin-top:auto;margin-bottom:12px}
.prog-bar{height:5px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.prog-label{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}
.course-footer{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.btn-join{flex:1;padding:10px 12px;border-radius:20px;background:var(--accent);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;text-align:center}
.btn-join:hover{background:#6d28d9;transform:translateY(-1px)}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);text-align:center}
.empty-icon{font-size:64px;margin-bottom:16px;opacity:0.5}
.empty-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty-text{font-size:14px;margin-bottom:24px;max-width:400px}
.empty-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:20px;background:var(--accent);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.empty-btn:hover{background:#6d28d9;transform:translateY(-1px)}

/* DETAIL SCREEN */
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:transparent;cursor:pointer;color:var(--text);font-size:12px;font-weight:600;margin-bottom:18px;transition:all 0.15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

.detail-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;padding:20px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius)}
.detail-hero{height:120px;width:200px;border-radius:var(--radius);background:linear-gradient(135deg,#7c3aed,#9333ea);flex-shrink:0}
.detail-hero.teal{background:linear-gradient(135deg,#0891b2,#06b6d4)}
.detail-info{flex:1}
.detail-title{font-size:18px;font-weight:700;letter-spacing:-0.02em;color:var(--text);margin-bottom:4px}
.detail-mentor{font-size:13px;color:var(--muted);margin-bottom:10px}
.detail-meta{display:flex;gap:24px;font-size:12px}
.meta-item{display:flex;flex-direction:column}
.meta-label{color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:0.04em;font-size:10px;margin-bottom:2px}
.meta-value{font-weight:600;color:var(--text)}

/* TABS */
.tab-nav{display:flex;gap:16px;border-bottom:1.5px solid var(--border);margin-bottom:18px}
.tab-btn{padding:12px 0;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.15s;border-bottom:2px solid transparent;position:relative;top:1.5px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.visible{display:block}

/* TOPIC PROGRESS */
.topic-item{padding:12px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.topic-item:last-child{border-bottom:none}
.topic-name{font-size:13px;font-weight:600;color:var(--text)}
.topic-progress{display:flex;align-items:center;gap:8px;flex:1;max-width:200px;margin-left:20px}
.topic-bar{flex:1;height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.topic-bar .prog-fill{height:100%}
.topic-pct{font-size:11px;color:var(--muted);width:30px;text-align:right;font-weight:600}

/* CURRICULUM */
.curriculum-section{margin-bottom:24px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
.curriculum-header{padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:all 0.15s}
.curriculum-header:hover{background:#faf9ff}
.curriculum-title{font-weight:600;color:var(--text);font-size:13px}
.curriculum-toggle{font-size:12px;color:var(--muted);transition:transform 0.15s}
.curriculum-toggle.open{transform:rotate(180deg)}
.curriculum-content{padding:14px 16px;display:none;max-height:400px;overflow-y:auto}
.curriculum-content.open{display:block}
.curriculum-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.curriculum-item:last-child{border-bottom:none}
.item-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);font-size:14px}
.item-details{flex:1;min-width:0}
.item-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.item-meta{font-size:11px;color:var(--muted)}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;padding:9px 16px;text-align:left;border-bottom:1.5px solid var(--border);white-space:nowrap;background:var(--bg)}
td{padding:11px 16px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf9ff}

/* MENTOR CARD */
.mentor-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.mentor-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;margin:0 auto 14px}
.mentor-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.mentor-title{font-size:12px;color:var(--muted);margin-bottom:12px}
.mentor-avail{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}

/* PILLS & TAGS */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.active{background:var(--green-bg);color:#059669}
.pill.pending{background:var(--amber-bg);color:var(--amber)}
.tag{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:500;color:var(--muted)}

/* MODAL */
dialog{border:none;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,0.2);width:90%;max-width:520px;max-height:90vh;padding:0;animation:slideUp 0.3s ease-out;margin:auto}
dialog::backdrop{background:rgba(0,0,0,0.4)}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{padding:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:700;color:var(--text)}
.modal-close{width:32px;height:32px;border:none;background:var(--bg);border-radius:8px;cursor:pointer;color:var(--muted);font-size:16px;transition:all 0.15s}
.modal-close:hover{background:rgba(0,0,0,0.1);color:var(--text)}
.modal-body{padding:24px}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em}
.form-input,.form-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:all 0.15s}
.form-input:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.08)}
.form-select{background:var(--surface);cursor:pointer}
.time-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:12px;margin-top:24px;padding-top:24px;border-top:1px solid var(--border)}
.btn-submit{flex:1;padding:12px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-submit:hover{background:#6d28d9;transform:translateY(-1px)}
.btn-cancel{flex:1;padding:12px 16px;background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-cancel:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="layout">

<!-- ═══ SIDEBAR ═══ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.5l5 3.5v8H5V8l5-3.5z"/><rect x="7.5" y="11" width="5" height="5" rx="0.5"/></svg>
    </div>
    <div>
      <div class="logo-name">LMS Portal</div>
      <div class="logo-sub">Student</div>
    </div>
  </div>

  <div class="sidebar-scroll">
    <div class="nav-section">Main</div>
    <div class="nav-item" data-page="student_dashboard.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
      Dashboard
    </div>
    <div class="nav-item active" data-page="my_courses.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12a1 1 0 011 1v10a1 1 0 01-1 1H2a1 1 0 01-1-1V3a1 1 0 011-1zm1 3v7h10V5H3z"/><path d="M5 7h6v1.5H5z"/></svg>
      My Courses
    </div>
    <div class="nav-item" data-page="timetable.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="14" height="10" rx="1.5"/><path d="M4 8h8M4 11h5"/></svg>
      Timetable
    </div>
    <div class="nav-item" data-page="invoices.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 4a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V4zm2-1v9h8V3H4zm1 2h6v1H5V5zm0 2h6v1H5V7zm0 2h4v1H5V9z"/></svg>
      Invoices
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="user-avatar">PS</div>
      <div>
        <div class="user-name">Priya Sharma</div>
        <div class="user-role">Class 11</div>
      </div>
      <div class="status-dot"></div>
    </div>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title">My Courses</div>
      <div class="topbar-breadcrumb" id="topbarBreadcrumb">Browse and manage your courses</div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- COURSES LIST/BROWSE SCREEN -->
    <div id="listScreen" class="screen visible">
      <!-- TABS -->
      <div class="course-tabs">
        <button class="course-tab active" onclick="switchCourseTab('my')">My Courses</button>
        <button class="course-tab" onclick="switchCourseTab('available')">Browse Courses</button>
      </div>

      <!-- MY COURSES TAB -->
      <div id="myCoursesTab">
        <!-- TOOLBAR -->
        <div class="toolbar" id="toolbarMy">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="6.5" r="5.5"/><path d="M11 11L15 15"/></svg>
            <input id="searchInput" class="search-input" placeholder="Search your courses…">
          </div>
        </div>

        <!-- EMPTY STATE OR GRID -->
        <div id="myCoursesList"></div>
      </div>

      <!-- AVAILABLE COURSES TAB -->
      <div id="availableCoursesTab" style="display:none">
        <!-- TOOLBAR -->
        <div class="toolbar" id="toolbarAvailable">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="6.5" r="5.5"/><path d="M11 11L15 15"/></svg>
            <input id="searchInputAvailable" class="search-input" placeholder="Search available courses…">
          </div>
        </div>

        <!-- AVAILABLE COURSES GRID -->
        <div id="availableCoursesList"></div>
      </div>
    </div>

    <!-- DETAIL SCREEN -->
    <div id="detailScreen" class="screen">
      <button class="back-btn" onclick="goBack()">← Back</button>

      <div class="detail-header">
        <div id="detailHero" class="detail-hero"></div>
        <div class="detail-info">
          <div class="detail-title" id="detailTitle">Mathematics</div>
          <div class="detail-mentor" id="detailMentor">Anand Kumar</div>
          <div class="detail-meta">
            <div class="meta-item">
              <div class="meta-label">Classes Done</div>
              <div class="meta-value" id="detailClassesDone">12</div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Remaining</div>
              <div class="meta-value" id="detailRemaining">8</div>
            </div>
            <div class="meta-item">

            <div>
              <label for="endTime" class="form-label" style="font-size:11px;margin-bottom:6px">End Time</label>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeEnrollmentModal()">Cancel</button>
          <button type="submit" class="btn-submit">Join Course</button>

      </form>
    </div>
  </div>
</dialog>

function renderCourseGrid(courses, containerId, forEnrolled = false) {
  const container = document.getElementById(containerId);

  if (forEnrolled && courses.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <div class="empty-title">No Courses Yet</div>
        <div class="empty-text">You haven't enrolled in any courses yet. Browse available courses and join to get started!</div>
        <button class="empty-btn" onclick="switchCourseTab('available')">Browse Courses →</button>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="course-grid">
      ${courses.map(c => `
        <div class="course-card" onclick="openDetail(${c.id})">
          <div class="course-header ${c.hero}">
            <div class="course-type">${c.type}</div>
            <div class="course-header-title">${c.title}</div>
          </div>
          <div class="course-body">
            ${forEnrolled ? `
              <div class="course-meta">
                <div class="course-meta-item">
                  <div class="course-meta-label">Status</div>
                  <span class="pill ${c.enrollmentStatus === 'pending' ? 'pending' : 'active'}">${c.enrollmentStatus === 'pending' ? 'Pending Approval' : 'Active'}</span>
                </div>
              </div>
              <div class="course-meta">
                <div class="course-meta-item">
                  <div class="course-meta-label">Progress</div>
                  <div class="course-meta-value">${c.progress}%</div>
                </div>
                <div class="course-meta-item">
                  <div class="course-meta-label">Classes</div>
                  <div class="course-meta-value">${c.classesDone}</div>
                </div>
              </div>
              <div class="course-prog">
                <div class="prog-bar"><div class="prog-fill" style="width:${c.progress}%"></div></div>
              </div>
            ` : `
              <div class="course-meta">
                <div class="course-meta-item">
                  <div class="course-meta-label">Price</div>
                  <div class="course-price">₹${c.price.toLocaleString()}</div>
                </div>
                <div class="course-meta-item">
                  <div class="course-meta-label">Classes</div>
                  <div class="course-meta-value">${c.remaining}</div>
                </div>
              </div>
            `}
            ${!forEnrolled ? `
              <div class="course-footer">
                <button class="btn-join" onclick="enrollCourse(event, ${c.id})">Join Course</button>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function switchCourseTab(tab) {
  const tabs = document.querySelectorAll('.course-tab');
  tabs.forEach(t => t.classList.remove('active'));

  const activeBtn = Array.from(tabs).find(t => t.textContent.includes(tab === 'my' ? 'My Courses' : 'Browse'));
  if (activeBtn) activeBtn.classList.add('active');

  document.getElementById('myCoursesTab').style.display = tab === 'my' ? 'block' : 'none';
  document.getElementById('availableCoursesTab').style.display = tab === 'available' ? 'block' : 'none';

  if (tab === 'my') {
    renderCourseGrid(enrolledCourses, 'myCoursesList', true);
    topbarBreadcrumb.textContent = `${enrolledCourses.length} enrolled`;
  } else {
    const available = allCourses.filter(c => !enrolledCourses.find(ec => ec.id === c.id));
    renderCourseGrid(available, 'availableCoursesList', false);
    topbarBreadcrumb.textContent = `${available.length} courses available`;
  }
}

function enrollCourse(e, courseId) {
  e.stopPropagation();
  enrollingCourseId = courseId;
  const course = allCourses.find(c => c.id === courseId);
  document.getElementById('enrollModalTitle').textContent = `Join ${course.title}`;
  document.getElementById('enrollmentForm').reset();
  document.getElementById('enrollmentModal').showModal();
}

function closeEnrollmentModal() {
  document.getElementById('enrollmentModal').close();
  enrollingCourseId = null;
  document.getElementById('enrollmentForm').reset();
}

function submitEnrollment(e) {
  e.preventDefault();

  const startTime = document.getElementById('startTime').value;
  const endTime = document.getElementById('endTime').value;

  if (!startTime || !endTime) {
    alert('Please fill all required fields');
    return;
  }

  const course = allCourses.find(c => c.id === enrollingCourseId);
  const enrolledCourse = {
    ...course,
    enrollmentStatus: 'pending',
    preferredStartTime: startTime,
    preferredEndTime: endTime
  };

  if (!enrolledCourses.find(c => c.id === enrollingCourseId)) {
    enrolledCourses.push(enrolledCourse);
  }

  closeEnrollmentModal();
  switchCourseTab('my');
}

function openDetail(id) {
  const course = enrolledCourses.find(c => c.id === id);
  if (!course) return;

  // If pending approval, show simplified view
  if (course.enrollmentStatus === 'pending') {
    document.getElementById('detailHero').className = `detail-hero ${course.hero}`;
    document.getElementById('detailTitle').textContent = course.title;
    document.getElementById('detailMentor').textContent = '';
    document.getElementById('detailClassesDone').textContent = '—';
    document.getElementById('detailRemaining').textContent = '—';
    document.getElementById('detailProgress').textContent = '—';

    document.getElementById('curriculumList').innerHTML = `
      <div style="padding:40px 20px;text-align:center;color:var(--muted)">
        <div style="font-size:48px;margin-bottom:16px">⏳</div>
        <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px">Awaiting Approval</div>
        <div style="font-size:13px">Your enrollment is under review. You'll get access to course details once it's approved.</div>
      </div>
    `;

    document.getElementById('sessionsList').innerHTML = '';
    document.getElementById('mentorCard').innerHTML = '';

    listScreen.classList.remove('visible');
    detailScreen.classList.add('visible');

    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector('.tab-btn').classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('curriculum').classList.add('visible');
    return;
  }

  document.getElementById('detailHero').className = `detail-hero ${course.hero}`;
  document.getElementById('detailTitle').textContent = course.title;
  document.getElementById('detailMentor').textContent = course.mentor;
  document.getElementById('detailClassesDone').textContent = course.classesDone;
  document.getElementById('detailRemaining').textContent = course.remaining;
  document.getElementById('detailProgress').textContent = `${course.progress}%`;

  document.getElementById('curriculumList').innerHTML = course.topics.map((t, idx) => `
    <div class="curriculum-section">
      <div class="curriculum-header" onclick="toggleCurriculum(this)">
        <div>
          <div class="curriculum-title">${t.name}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${t.videos?.length || 0} videos · ${t.materials?.length || 0} materials</div>
        </div>
        <div class="curriculum-toggle">▼</div>
      </div>
      <div class="curriculum-content">
        <div style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Videos</div>
          ${(t.videos || []).map(v => `
            <div class="curriculum-item">
              <div class="item-icon">▶</div>
              <div class="item-details">
                <div class="item-title">${v.title}</div>
                <div class="item-meta">${v.duration}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div>
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Materials</div>
          ${(t.materials || []).map(m => `
            <div class="curriculum-item">
              <div class="item-icon">📄</div>
              <div class="item-details">
                <div class="item-title">${m.title}</div>
                <div class="item-meta">${m.type} · ${m.size}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('sessionsList').innerHTML = course.sessions.map(s => `
    <tr>
      <td style="color:var(--accent);font-weight:600;font-size:12px">${s.date}</td>
      <td style="font-weight:600">${s.time}</td>
      <td>${s.mentor}</td>
      <td><span class="pill ${s.status}">${s.status.charAt(0).toUpperCase() + s.status.slice(1)}</span></td>
    </tr>
  `).join('');

  const mentorData = { name: course.mentor, title: 'Course Instructor', availability: 'Mon–Fri, 3–5 PM\nSat, 10 AM–12 PM' };
  document.getElementById('mentorCard').innerHTML = `
    <div class="mentor-avatar">${course.mentor.split(' ').map(w => w[0]).join('')}</div>
    <div class="mentor-name">${mentorData.name}</div>
    <div class="mentor-title">${mentorData.title}</div>
    <div class="mentor-avail"><strong>Available:</strong><br>${mentorData.availability}</div>
    <button class="empty-btn" style="margin-top:14px">Send Message</button>
  `;

  listScreen.classList.remove('visible');
  detailScreen.classList.add('visible');

  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector('.tab-btn').classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('visible'));
  document.getElementById('curriculum').classList.add('visible');
}

function goBack() {
  detailScreen.classList.remove('visible');
  listScreen.classList.add('visible');
}

function switchTab(btn, panelId) {
  btn.closest('.tab-nav').querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('visible'));
  document.getElementById(panelId).classList.add('visible');
}

function toggleCurriculum(header) {
  const content = header.nextElementSibling;
  const toggle = header.querySelector('.curriculum-toggle');
  content.classList.toggle('open');
  toggle.classList.toggle('open');
}
