<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMS Portal — Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3f0;
  --surface:#ffffff;
  --text:#1a1a2e;
  --muted:#6b7280;
  --border:rgba(0,0,0,0.07);
  --accent:#7c3aed;
  --accent2:#a78bfa;
  --accent-light:#ede9fe;
  --green:#059669;--green-bg:#ecfdf5;
  --radius:12px;--radius-sm:8px;
  font-family:'Plus Jakarta Sans',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden}
.layout{display:flex;height:100vh}

/* ─── SIDEBAR ─── */
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#a78bfa);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:16px;height:16px;fill:#fff}
.logo-name{font-family:'Sora',sans-serif;font-size:14px;font-weight:700;color:#1a1a2e}
.sidebar-scroll{flex:1;overflow-y:auto;padding:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#6b7280;font-size:13px;font-weight:500;margin:2px 0;transition:all 0.15s;border-left:2px solid transparent}
.nav-item.active{background:rgba(109,40,217,0.1);color:#7c3aed;border-left-color:#7c3aed}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.sidebar-footer{padding:14px 12px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:8px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
.user-name{font-size:12px;font-weight:600;color:#1a1a2e}
.logout-btn{width:100%;padding:8px 12px;border:1.5px solid var(--border);background:transparent;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.15s;margin-top:12px}
.logout-btn:hover{border-color:#dc2626;color:#dc2626}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:700;font-family:'Sora',sans-serif}

/* ─── CONTENT ─── */
.content{flex:1;overflow-y:auto;padding:24px 28px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:2px}

.back-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:transparent;cursor:pointer;color:var(--text);font-size:12px;font-weight:600;margin-bottom:20px;transition:all 0.15s}
.back-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

.section{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.section-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:16px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.info-item{display:flex;flex-direction:column}
.info-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px}
.info-value{font-size:13px;font-weight:600;color:var(--text)}
.info-value.empty{color:var(--muted);font-style:italic}

.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;color:var(--text);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.03em}
.form-input,.form-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text);outline:none;transition:all 0.15s}
.form-input:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,0.08)}
.form-select{background:var(--surface);cursor:pointer}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.checkbox-group{display:flex;align-items:center;gap:8px}
.checkbox-group input{width:16px;height:16px;cursor:pointer}
.checkbox-group label{font-size:12px;font-weight:600;color:var(--text);cursor:pointer}

.btn-submit{padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-submit:hover{background:#6d28d9;transform:translateY(-1px)}

.parent-list{display:flex;flex-direction:column;gap:12px}
.parent-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;justify-content:space-between;align-items:flex-start}
.parent-info{flex:1}
.parent-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.parent-meta{font-size:11px;color:var(--muted)}
.parent-actions{display:flex;gap:8px}
.btn-delete{padding:4px 8px;background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.15s}
.btn-delete:hover{background:#fef2f2;border-color:#dc2626}
.badge-primary{display:inline-block;padding:2px 8px;background:var(--accent-light);color:var(--accent);border-radius:12px;font-size:10px;font-weight:600}
</style>
</head>
<body>
<div class="layout">

<!-- ═══ SIDEBAR ═══ -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20"><path d="M10 2L3 7v11h14V7L10 2zm0 2.5l5 3.5v8H5V8l5-3.5z"/><rect x="7.5" y="11" width="5" height="5" rx="0.5"/></svg>
    </div>
    <div class="logo-name">LMS</div>
  </div>

  <div class="sidebar-scroll">
    <div class="nav-item" data-page="student_dashboard.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
      Dashboard
    </div>
    <div class="nav-item" data-page="my_courses.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v1H2zm0 3h12v7H2z"/></svg>
      My Courses
    </div>
    <div class="nav-item" data-page="timetable.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="14" height="10" rx="1.5"/></svg>
      Timetable
    </div>
    <div class="nav-item" data-page="invoices.html">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="12" height="12" rx="1"/></svg>
      Invoices
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="user-card" onclick="goToProfile()">
      <div class="user-avatar">PS</div>
      <div>
        <div class="user-name">Priya Sharma</div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Profile</div>
  </div>

  <div class="content">
    <button class="back-btn" onclick="goBack()">← Back</button>

    <!-- STUDENT INFO -->
    <div class="section">
      <div class="section-title">Student Details</div>
      <div class="info-grid">
        <div class="info-item">
          <div class="info-label">Full Name</div>
          <div class="info-value">Priya Sharma</div>
        </div>
        <div class="info-item">
          <div class="info-label">Email</div>
          <div class="info-value">student@yopmail.com</div>
        </div>
        <div class="info-item">
          <div class="info-label">Phone Number</div>
          <div class="info-value">+91 123456789</div>
        </div>
        <div class="info-item">
          <div class="info-label">Student ID</div>
          <div class="info-value">STD-2024-001</div>
        </div>
        <div class="info-item">
          <div class="info-label">Class</div>
          <div class="info-value" id="studentClass"><span class="info-value empty">Not specified</span></div>
        </div>
      </div>
    </div>

    <!-- PARENT CONTACTS -->
    <div class="section">
      <div class="section-title">Parent / Guardian Contacts</div>

      <!-- Add Parent Form -->
      <div style="background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:16px;margin-bottom:20px">
        <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:16px">Add Parent Contact</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="parentName">Name</label>
            <input type="text" id="parentName" class="form-input" placeholder="e.g., Rajesh Sharma" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="parentRelation">Relation</label>
            <select id="parentRelation" class="form-select" required>
              <option value="">Select relation</option>
              <option value="father">Father</option>
              <option value="mother">Mother</option>
              <option value="guardian">Guardian</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="parentPhone">Phone Number</label>
            <input type="tel" id="parentPhone" class="form-input" placeholder="e.g., 9876543210" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="parentEmail">Email (Optional)</label>
            <input type="email" id="parentEmail" class="form-input" placeholder="e.g., parent@example.com">
          </div>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="parentPrimary">
          <label for="parentPrimary">Set as primary contact</label>
        </div>

        <button type="button" class="btn-submit" onclick="addParent()" style="margin-top:12px">Add Contact</button>
      </div>

      <!-- Parent List -->
      <div id="parentsList" class="parent-list"></div>
      <div id="noParents" style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No parent contacts added yet</div>
    </div>
  </div>
</div>

</div>

<script>
let parentContacts = JSON.parse(localStorage.getItem('parentContacts')) || [];

function renderParents() {
  const parentsList = document.getElementById('parentsList');
  const noParents = document.getElementById('noParents');

  if (parentContacts.length === 0) {
    parentsList.innerHTML = '';
    noParents.style.display = 'block';
    return;
  }

  noParents.style.display = 'none';
  parentsList.innerHTML = parentContacts.map((parent, idx) => `
    <div class="parent-item">
      <div class="parent-info">
        <div class="parent-name">${parent.name} ${parent.isPrimary ? '<span class="badge-primary">Primary</span>' : ''}</div>
        <div class="parent-meta">${parent.relation.charAt(0).toUpperCase() + parent.relation.slice(1)} · ${parent.phone}${parent.email ? ' · ' + parent.email : ''}</div>
      </div>
      <div class="parent-actions">
        <button class="btn-delete" onclick="deleteParent(${idx})">Delete</button>
      </div>
    </div>
  `).join('');
}

function addParent() {
  const name = document.getElementById('parentName').value.trim();
  const relation = document.getElementById('parentRelation').value;
  const phone = document.getElementById('parentPhone').value.trim();
  const email = document.getElementById('parentEmail').value.trim();
  const isPrimary = document.getElementById('parentPrimary').checked;

  if (!name || !relation || !phone) {
    alert('Please fill required fields');
    return;
  }

  if (isPrimary) {
    parentContacts.forEach(p => p.isPrimary = false);
  }

  parentContacts.push({ name, relation, phone, email, isPrimary });
  localStorage.setItem('parentContacts', JSON.stringify(parentContacts));

  document.getElementById('parentName').value = '';
  document.getElementById('parentRelation').value = '';
  document.getElementById('parentPhone').value = '';
  document.getElementById('parentEmail').value = '';
  document.getElementById('parentPrimary').checked = false;

  renderParents();
}

function deleteParent(idx) {
  if (confirm('Delete this contact?')) {
    parentContacts.splice(idx, 1);
    localStorage.setItem('parentContacts', JSON.stringify(parentContacts));
    renderParents();
  }
}

function goBack() {
  window.history.back();
}

function goToProfile() {
  // Already on profile
}

function logout() {
  if (confirm('Are you sure you want to logout?')) {
    localStorage.clear();
    sessionStorage.clear();
    window.location.href = 'login.html';
  }
}

renderParents();
</script>

</body>
</html>
